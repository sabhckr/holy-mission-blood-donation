<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lakshmipur Blood Donation</title>
<style>
  :root { --brand: #a71930; --ink: #252b33; --muted: #5d6570; --bg: #fffaf7; --line: #f1e4df; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: 'Noto Sans Bengali', 'Hind Siliguri', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: grid; place-items: center; min-height: 100vh;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    line-height: 1.6;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  svg { width: 64px; height: 64px; color: var(--brand); }
  h1 { font-size: 1.35rem; margin: 16px 0 6px; }
  p { margin: 0 0 6px; color: var(--muted); }
  .en { font-size: .9rem; }
  button {
    margin: 22px 0 18px; width: 100%; min-height: 54px; border: 0; border-radius: 14px;
    background: var(--brand); color: #fff; font: inherit; font-weight: 700; font-size: 1.05rem;
  }
  button:active { opacity: .85; }
  .tip { border-top: 1px solid var(--line); padding-top: 14px; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5c-.4 0-.8.2-1 .6C12.3 7.6 6 15.2 6 20.5 6 26 10.5 30 16 30s10-4 10-9.5C26 15.2 19.7 7.6 17 3.1c-.2-.4-.6-.6-1-.6Z" fill="currentColor"/><path d="M11.5 20.5c0 2.6 2 4.6 4.5 4.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".85"/></svg>
  <h1>ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না</h1>
  <p>মোবাইল ডেটা বা ওয়াই-ফাই চালু আছে কি না দেখে আবার চেষ্টা করুন।</p>
  <p class="en" lang="en">No internet connection. Check your mobile data or Wi-Fi and try again.</p>
  <button type="button" onclick="location.replace('https://lakshmipur-blood-donation.vercel.app')">আবার চেষ্টা করুন · Try again</button>
  <p class="tip">জরুরি হলে সরাসরি হাসপাতালের ব্লাড ব্যাংকে যোগাযোগ করুন।</p>
</main>
</body>
</html>
